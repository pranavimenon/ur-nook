<style>
:root{
  --bg:#0d1117; --panel:#141a22; --panel-2:#1a222c; --line:#232d38; --grid:#1c2530;
  --blue:#5fc9e8; --blue-dim:#2c5568; --amber:#e8a94f; --red:#e2685f; --green:#6bcf9a;
  --text:#dfe6ee; --muted:#7c8a99;
  --mono:'Consolas','IBM Plex Mono','SFMono-Regular',monospace;
  --sans:-apple-system,'Segoe UI',Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
#root{height:100vh;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

.topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);}
.brand .mark{width:22px;height:22px;border:2px solid var(--blue);position:relative;flex-shrink:0;}
.brand .mark::after{content:'';position:absolute;inset:4px;border:1px solid var(--blue);opacity:.6;}
.brand b{font-size:15px;font-weight:600;color:#fff;}
.brand span{color:var(--muted);font-size:11px;}
.spacer{flex:1;}
.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{border-color:var(--blue-dim);}
.btn.primary{background:var(--blue-dim);border-color:var(--blue);color:#fff;font-weight:600;}
.btn.primary:hover{background:#336880;}
.btn.big{padding:12px 22px;font-size:14px;}
.btn.danger{border-color:#5a2a2a;color:var(--red);}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn.small{padding:5px 10px;font-size:11.5px;}

/* ---------- Wizard shell ---------- */
.wizard-shell{flex:1;display:flex;flex-direction:column;min-height:0;}
.stepper{display:flex;align-items:center;justify-content:center;gap:0;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
.step-item{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px;border-radius:8px;}
.step-item:hover{background:var(--panel-2);}
.step-item.disabled{cursor:default;opacity:.45;}
.step-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--muted);flex-shrink:0;}
.step-item.active .step-circle{border-color:var(--blue);color:#fff;background:var(--blue-dim);}
.step-item.done .step-circle{border-color:var(--green);color:var(--green);background:transparent;}
.step-label{font-size:13px;color:var(--muted);}
.step-item.active .step-label{color:#fff;font-weight:600;}
.step-connector{width:44px;height:2px;background:var(--line);margin:0 2px;}

.wizard-body{flex:1;display:flex;min-height:0;}
.wizard-form{width:380px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;}
.wizard-form-inner{padding:20px 22px;}
.wizard-preview{flex:1;position:relative;background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px, var(--bg);overflow:hidden;}

.step-heading{margin-bottom:4px;}
.step-heading h2{margin:0;font-size:18px;color:#fff;}
.step-heading p{margin:6px 0 20px;font-size:12.5px;color:var(--muted);line-height:1.6;}

.uf .lbl{font-size:11.5px;color:var(--muted);margin-bottom:5px;display:block;}

input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:6px;font-size:13px;}

.chat-input{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);}
.chat-input input{flex:1;}

const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ============================== UNITS ============================== */
const UNITS_TO_CM = { cm: 1, in: 2.54, ft: 30.48 };
const toCm = (v, u) => parseFloat(v || 0) * UNITS_TO_CM[u];
const fromCm = (v, u) => (v / UNITS_TO_CM[u]);
const fmt = (v, u) => (Math.round(fromCm(v, u) * 100) / 100).toString();

/* ============================== UNDO SYSTEM ==============================
   Generic "checkpoint" history: every call to update() compares against the
   time of the last checkpoint. Rapid-fire changes (typing a number, dragging
   an item across the canvas, sliding a rotation knob) land inside the same
   ~600ms burst and only create ONE undo step; a pause longer than that starts
   a fresh checkpoint. This means Ctrl+Z / the Undo button always reverts one
   whole "decision" instead of one keystroke or one animation frame. */
function useUndoableState(initial, coalesceMs){
  coalesceMs = coalesceMs || 600;
  const [present, setPresent] = useState(initial);
  const [past, setPast] = useState([]);
  const presentRef = useRef(present);
  presentRef.current = present;
  const lastPushRef = useRef(0);

  const update = useCallback((updater) => {
    const now = Date.now();
    if (now - lastPushRef.current > coalesceMs){
      setPast(p => [...p.slice(-79), presentRef.current]);
    }
    lastPushRef.current = now;
    setPresent(prev => typeof updater === 'function' ? updater(prev) : updater);
  }, [coalesceMs]);

  /* force a new checkpoint even if inside an active burst — used before
     one-shot actions like Save/Load or Lock so they don't merge into
     whatever the user was just doing. */
  const updateHard = useCallback((updater) => {
    setPast(p => [...p.slice(-79), presentRef.current]);
    lastPushRef.current = Date.now();
    setPresent(prev => typeof updater === 'function' ? updater(prev) : updater);
  }, []);

  const undo = useCallback(() => {
    setPast(p => {
      if (p.length===0) return p;
      setPresent(p[p.length-1]);
      lastPushRef.current = 0; // next change always opens a fresh checkpoint
      return p.slice(0,-1);
    });
  }, []);

  return { present, update, updateHard, undo, canUndo: past.length>0 };
}

          <option value="cm">cm</option><option value="in">in</option><option value="ft">ft</option>
        </select>

  );
}

/* parse free text like "dining table 180x90x75 cm" into a name fragment + dimensions */
function parseSearchQuery(q){
  let unit = 'cm';
  if (/\bft\b|\bfeet\b/i.test(q)) unit='ft';
  else if (/\bin\b|\binch(es)?\b|"/i.test(q)) unit='in';
  else if (/\bcm\b/i.test(q)) unit='cm';
  const nums = (q.match(/\d+(\.\d+)?/g)||[]).map(Number);
  const nameText = q.replace(/[\dx×*"]/g,' ').replace(/\b(cm|in|inch|inches|ft|feet)\b/gi,' ').replace(/\s+/g,' ').trim();
  return { nameText, dims: nums.length ? nums : null, unit };
}

/* ============================== POLYGON / WALL GEOMETRY ============================== */
function wallsFromPolygon(poly){
  const n = poly.length;
  return poly.map((p,i)=>{
    const q = poly[(i+1)%n];
    const dx = q[0]-p[0], dy = q[1]-p[1];
    const length = Math.hypot(dx,dy);
    return { index:i, a:p, b:q, length, ux: length? dx/length:0, uy: length? dy/length:0 };
  });
}
const ZONE_NAMES = ['N','NE','E','SE','S','SW','W','NW'];
function compassOfNormal(nx, ny){
  let angle = Math.atan2(nx, -ny) * 180/Math.PI;
  angle = ((angle % 360) + 360) % 360;
  return ZONE_NAMES[Math.round(angle/45) % 8];
}
function wallCompass(wall){
  // outward normal for a clockwise polygon in y-down space
  const nx = wall.uy, ny = -wall.ux;
  return compassOfNormal(nx, ny);
}
function applyWallSection(polygon, wallIndex, offsetCm, widthCm, depthSignedCm){
  const walls = wallsFromPolygon(polygon);
  const w = walls[wallIndex];
  let offset = Math.max(0, Math.min(offsetCm, w.length));
  let width = Math.max(1, Math.min(widthCm, w.length - offset));
  const nx = w.uy, ny = -w.ux; // outward normal
  const A = w.a;
  const P1 = [A[0]+w.ux*offset, A[1]+w.uy*offset];
  const P2 = [P1[0]+nx*depthSignedCm, P1[1]+ny*depthSignedCm];
  const P4 = [A[0]+w.ux*(offset+width), A[1]+w.uy*(offset+width)];
  const P3 = [P4[0]+nx*depthSignedCm, P4[1]+ny*depthSignedCm];
  const result = [...polygon];
  result.splice(wallIndex+1, 0, P1, P2, P3, P4);
  // dedupe near-identical consecutive points
  const cleaned = [];
  for (const pt of result){
    const last = cleaned[cleaned.length-1];
    if (!last || Math.hypot(pt[0]-last[0], pt[1]-last[1]) > 0.5) cleaned.push(pt);
  }
  if (cleaned.length>1){
    const first = cleaned[0], last = cleaned[cleaned.length-1];
    if (Math.hypot(first[0]-last[0], first[1]-last[1]) < 0.5) cleaned.pop();
  }
  return cleaned;
}
function polygonBounds(poly){
  const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]);
  return { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
}
function pointInPolygon(x, y, poly){
  let inside = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

/* ---- OBB collision (for furniture / pillars / obstructions) ---- */
function getCorners(cx, cy, w, d, rotDeg) {
  const rot = (rotDeg || 0) * Math.PI / 180;
  const hw = w / 2, hd = d / 2;
  const pts = [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]];
  return pts.map(([x,y]) => {
    const rx = x * Math.cos(rot) - y * Math.sin(rot);
    const ry = x * Math.sin(rot) + y * Math.cos(rot);
    return [cx + rx, cy + ry];
  });
}
function satOverlap(cornersA, cornersB) {
  const axes = [];
  [cornersA, cornersB].forEach(corners => {
    for (let i=0;i<4;i++){
      const p1=corners[i], p2=corners[(i+1)%4];
      axes.push([-(p2[1]-p1[1]), p2[0]-p1[0]]);
    }
  });
  for (const [ax,ay] of axes) {
    const len = Math.hypot(ax,ay) || 1;
    const nx=ax/len, ny=ay/len;
    let minA=Infinity,maxA=-Infinity,minB=Infinity,maxB=-Infinity;
    cornersA.forEach(([x,y])=>{ const p=x*nx+y*ny; minA=Math.min(minA,p); maxA=Math.max(maxA,p);});
    cornersB.forEach(([x,y])=>{ const p=x*nx+y*ny; minB=Math.min(minB,p); maxB=Math.max(maxB,p);});
    if (maxA < minB || maxB < minA) return false;
  }
  return true;
}
function rectsOverlap(a, b) {
  return satOverlap(getCorners(a.x,a.y,a.w,a.d,a.rotation||0), getCorners(b.x,b.y,b.w,b.d,b.rotation||0));
}
function checkCollisions(item, room, otherFurniture) {
  for (const p of [...room.pillars, ...room.obstructions.filter(o=>o.solid)]) {
    if (rectsOverlap(item, p)) return true;
  }
  for (const f of otherFurniture) {
    if (f.id === item.id) continue;
    if (rectsOverlap(item, f)) return true;
  }
  const corners = getCorners(item.x, item.y, item.w, item.d, item.rotation||0);
  for (const [x,y] of corners) {
    if (!pointInPolygon(x, y, room.polygon)) return true;
  }
  return false;
}
function getZone(cx, cy, room, northAngleDeg) {
  const b = polygonBounds(room.polygon);
  const dx = cx - (b.minX+b.maxX)/2;
  const dy = cy - (b.minY+b.maxY)/2;
  let angle = Math.atan2(dx, -dy) * 180/Math.PI;
  angle -= northAngleDeg;
  angle = ((angle % 360) + 360) % 360;
  return ZONE_NAMES[Math.round(angle / 45) % 8];
}

/* ============================== DEFAULT STATE ============================== */
function rectPolygon(w,d){ return [[0,0],[w,0],[w,d],[0,d]]; }
const STORAGE_KEY = 'urnook_layout_v1';

/* ============================== BACKEND PROJECTS API ==============================
   This page is served from the same ur nook website (Next.js) as the /api/projects
   routes, so plain relative fetches automatically carry the visitor's Clerk login
   cookie — no separate API base URL or key needed. */
async function apiRequest(path, options){
  options = options || {};
  const resp = await fetch('/api' + path, {
    headers: Object.assign({'Content-Type':'application/json'}, options.headers||{}),
    ...options
  });
  if (resp.status===204) return null;
  const data = await resp.json().catch(()=>null);
  if (!resp.ok){
    const err = new Error((data && data.error) || `Request failed (HTTP ${resp.status})`);
    err.status = resp.status;
    throw err;
  }
  return data;
}
const projectsApi = {
  get: (id) => apiRequest(`/projects/${id}`),
  update: (id, payload) => apiRequest(`/projects/${id}`, {method:'PUT', body:JSON.stringify(payload)}),
};

/* small 2D floor-plan snapshot saved alongside the project, shown as the card
   preview back on the dashboard */
function makeThumbnailFromSvg(svgEl){
  try{
    if (!svgEl) return null;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const xml = new XMLSerializer().serializeToString(clone);
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  }catch(e){ return null; }
}

/* which project this page is editing — passed in the URL by the dashboard,
   e.g. /designer.html?project=abc123 */
function getProjectIdFromUrl(){
  try{ return new URLSearchParams(window.location.search).get('project'); }
  catch(e){ return null; }
}

/* ============================== APP ============================== */
const INITIAL_APP_STATE = {
  phase: 'wizard', // 'wizard' | 'design'
  everLocked: false,
  hasShape: false,
  step: 1, // 1 sketch, 2 fixtures, 3 review
  room: { polygon: rectPolygon(400,350), height:270, pillars:[], niches:[], obstructions:[] },
  furniture: [],
  northAngle: 0,
  customPresets: [],
};

function App(){
  const { present: state, update, updateHard, undo, canUndo } = useUndoableState(INITIAL_APP_STATE);
  const { phase, everLocked, hasShape, step, room, furniture, northAngle, customPresets } = state;

  /* wrapper setters so every child component keeps calling setRoom(...), setFurniture(...), etc.
     exactly like plain useState — they all funnel into the single undo-tracked state above. */
  const makeSetter = (key) => (updater) => update(s => ({...s, [key]: typeof updater==='function' ? updater(s[key]) : updater}));
  const setPhase = makeSetter('phase');
  const setEverLocked = makeSetter('everLocked');
  const setHasShape = makeSetter('hasShape');
  const setStep = makeSetter('step');
  const setRoom = makeSetter('room');
  const setFurniture = makeSetter('furniture');
  const setNorthAngle = makeSetter('northAngle');
  const setCustomPresets = makeSetter('customPresets');

  const [displayUnit, setDisplayUnit] = useState('cm');

  /* ---------- single project sync: this page always edits exactly ONE
     project, whichever id the dashboard put in the URL — creating, listing,
     and deleting projects all happen back on the dashboard page now. ---------- */
  const [activeProjectId] = useState(() => getProjectIdFromUrl());
  const [projectName, setProjectName] = useState('');
  const [projectLoading, setProjectLoading] = useState(true);
  const [projectSaving, setProjectSaving] = useState(false);
  const [projectError, setProjectError] = useState(null);
  const [notSignedIn, setNotSignedIn] = useState(false);

  /* load the project once on mount */
  useEffect(()=>{
    if (!activeProjectId){ setProjectLoading(false); return; }
    (async () => {
      try {
        const project = await projectsApi.get(activeProjectId);
        updateHard(s => ({
          ...s,
          room: project.roomDimensions || s.room,
          furniture: project.furnitureItems || [],
          phase: 'design', hasShape: true, everLocked: true,
        }));
        setDisplayUnit(project.unitPreference || 'cm');
        setProjectName(project.name || '');
      } catch(err){
        if (err.status===401) setNotSignedIn(true);
        setProjectError(err.message);
      } finally {
        setProjectLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[activeProjectId]);

  /* the 2D floor plan SVG is the only place a preview thumbnail can come
     from; grabbed straight off the DOM at save-time rather than threading a
     ref through every component in between. Only available while the 2D
     view is the active tab — harmless if not (thumbnail just stays as-is). */
  const grabThumbnail = () => makeThumbnailFromSvg(document.querySelector('.canvas-wrap svg'));

  const saveProjectToBackend = async () => {
    if (!activeProjectId) return;
    setProjectSaving(true); setProjectError(null);
    try {
      const thumbnail = grabThumbnail();
      const payload = { unitPreference: displayUnit, roomDimensions: room, furnitureItems: furniture };
      if (thumbnail) payload.thumbnail = thumbnail;
      await projectsApi.update(activeProjectId, payload);
    } catch(err){
      if (err.status===401) setNotSignedIn(true);
      setProjectError(err.message);
    } finally { setProjectSaving(false); }
  };

  /* debounced autosave: 2s after room/furniture/unit settle, PUT to the
     backend — but only while editing a real project (i.e. we got here from
     the dashboard with a project id in the URL). */
  const autosaveTimerRef = useRef(null);
  const autosaveLastRef = useRef(null);
  useEffect(()=>{
    if (!activeProjectId || projectLoading) return;
    const serialized = JSON.stringify({room, furniture, displayUnit});
    if (serialized === autosaveLastRef.current) return;
    if (autosaveTimerRef.current) clearTimeout(autosaveTimerRef.current);
    autosaveTimerRef.current = setTimeout(()=>{
      autosaveLastRef.current = serialized;
      saveProjectToBackend();
    }, 2000);
    return () => { if (autosaveTimerRef.current) clearTimeout(autosaveTimerRef.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[activeProjectId, projectLoading, room, furniture, displayUnit]);

  /* while the sketch-drawing screen is active, it registers its own "undo last point"
     handler here so Ctrl+Z / the Undo button feel natural mid-sketch; once nothing is
     registered (or it returns null), Ctrl+Z falls back to the global history above. */
  const localUndoRef = useRef(null);
  const [hasLocalUndo, setHasLocalUndo] = useState(false);
  const registerLocalUndo = useCallback((fn) => { localUndoRef.current = fn; setHasLocalUndo(!!fn); }, []);

  const performUndo = useCallback(() => {
    if (localUndoRef.current){ localUndoRef.current(); return; }
    undo();
  }, [undo]);

  useEffect(()=>{
    const onKeyDown = (e) => {
      const isZ = e.key==='z' || e.key==='Z';
      if (isZ && (e.ctrlKey || e.metaKey) && !e.shiftKey){
        e.preventDefault();
        performUndo();
      }
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  },[performUndo]);

  useEffect(()=>{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      try{
        const data = JSON.parse(raw);
        updateHard(s => ({
          ...s,
          room: data.room || s.room,
          furniture: data.furniture || s.furniture,
          northAngle: typeof data.northAngle==='number' ? data.northAngle : s.northAngle,
          customPresets: data.customPresets || s.customPresets,
          phase: data.phase || s.phase,
          hasShape: data.phase==='design' ? true : s.hasShape,
          everLocked: data.phase==='design' ? true : s.everLocked,
        }));
      }catch(e){}
    }
    // eslint-disable-next-line
  },[]);

  const [saveMsg, setSaveMsg] = useState('');
  const saveLayout = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({room, furniture, northAngle, phase, customPresets}));
    setSaveMsg('Saved ✓'); setTimeout(()=>setSaveMsg(''),1600);
  };
  const loadLayout = () => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){ setSaveMsg('No saved layout'); setTimeout(()=>setSaveMsg(''),1600); return; }
    const data = JSON.parse(raw);
    updateHard(s => ({
      ...s,
      room: data.room || s.room,
      furniture: data.furniture || [],
      northAngle: data.northAngle || 0,
      customPresets: data.customPresets || [],
      phase: data.phase || 'wizard',
      hasShape: data.phase==='design' ? true : s.hasShape,
      everLocked: data.phase==='design' ? true : s.everLocked,
    }));
    setSaveMsg('Loaded ✓'); setTimeout(()=>setSaveMsg(''),1600);
  };

  const lockRoom = () => { updateHard(s => ({...s, phase:'design', everLocked:true})); };
  const unlockRoom = () => { updateHard(s => ({...s, phase:'wizard', step:1})); };

  if (!activeProjectId){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:14, background:'var(--bg)', color:'var(--text)'}}>
        <div style={{fontSize:15}}>No project selected.</div>
        <a href="/dashboard" className="btn primary">← Back to my projects</a>
      </div>
    );
  }
  if (notSignedIn){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column', gap:14, background:'var(--bg)', color:'var(--text)'}}>
        <div style={{fontSize:15}}>You need to be signed in to open this room.</div>
        <a href="/" className="btn primary">Sign in</a>
      </div>
    );
  }
  if (projectLoading){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--bg)', color:'var(--muted)'}}>
        Loading your room…
      </div>
    );
  }

  return (
    <React.Fragment>
      <TopBar unit={displayUnit} setUnit={setDisplayUnit} onSave={saveLayout} onLoad={loadLayout} saveMsg={saveMsg}
        phase={phase} onEditRoom={unlockRoom} onUndo={performUndo} canUndo={canUndo || hasLocalUndo}
        projectName={projectName} projectSaving={projectSaving} projectError={projectError}
        onSaveActiveProject={saveProjectToBackend} />
      {phase==='wizard' ? (
        <RoomWizard step={step} setStep={setStep} room={room} setRoom={setRoom} onLock={lockRoom} everLocked={everLocked}
          hasShape={hasShape} setHasShape={setHasShape} registerLocalUndo={registerLocalUndo} />
      ) : (
        <DesignStage room={room} furniture={furniture} setFurniture={setFurniture}
          northAngle={northAngle} setNorthAngle={setNorthAngle} unit={displayUnit} onEditRoom={unlockRoom}
          customPresets={customPresets} setCustomPresets={setCustomPresets} />
      )}
    </React.Fragment>
  );
}

/* ============================== ROOM WIZARD ============================== */
const STEP_DEFS = [
  {n:1, label:'Sketch your room'},
  {n:2, label:'Fixed elements'},
  {n:3, label:'Review & lock'},
];
function RoomWizard({step, setStep, room, setRoom, onLock, everLocked, hasShape, setHasShape, registerLocalUndo}){
  /* only the sketch-drawing screen wants a local undo handler; every other step
     falls back to the global history, so clear it whenever step !=1 */
  useEffect(()=>{ if (step!==1) registerLocalUndo(null); }, [step, registerLocalUndo]);
  return (
    <div className="wizard-shell">
      <div className="stepper">
        {STEP_DEFS.map((s,i)=>(
          <React.Fragment key={s.n}>
            <div className={"step-item " + (s.n===step?'active':'') + (s.n<step?' done':'') + (s.n>step?' disabled':'')}
              onClick={()=> s.n<=step && setStep(s.n)}>
              <div className="step-circle">{s.n<step ? '✓' : s.n}</div>
              <div className="step-label">{s.label}</div>
            </div>
            {i<STEP_DEFS.length-1 && <div className="step-connector"></div>}
          </React.Fragment>
        ))}
      </div>
      {step===1 && <StepSketch room={room} setRoom={setRoom} onNext={()=>setStep(2)} hasShape={hasShape} setHasShape={setHasShape} registerLocalUndo={registerLocalUndo} />}
      {step===2 && <StepFixtures room={room} setRoom={setRoom} onBack={()=>setStep(1)} onNext={()=>setStep(3)} />}
      {step===3 && <StepReview room={room} onBack={()=>setStep(2)} onLock={onLock} />}
    </div>
  );
}

/* live shape preview shared across steps 2-4 */
function ShapePreview({room, highlightWallIndex, onWallClick, children}){
  const PAD = 60;
  const b = polygonBounds(room.polygon);
  const w = b.maxX-b.minX, h = b.maxY-b.minY;
  const vbW = w + PAD*2, vbH = h + PAD*2;
  const walls = wallsFromPolygon(room.polygon);
  return (
    <div className="wizard-preview">
      <svg width="100%" height="100%" viewBox={`${b.minX-PAD} ${b.minY-PAD} ${vbW} ${vbH}`}>
        <g>
          <polygon points={room.polygon.map(p=>p.join(',')).join(' ')} fill="#10151c" stroke="#3a4652" strokeWidth="3" />
          {walls.map(wl=>(
            <line key={wl.index}
              x1={wl.a[0]} y1={wl.a[1]} x2={wl.b[0]} y2={wl.b[1]}
              stroke={highlightWallIndex===wl.index ? '#5fc9e8' : 'transparent'}
              strokeWidth="14" strokeLinecap="round"
              onClick={()=>onWallClick && onWallClick(wl.index)}
              style={{cursor: onWallClick ? 'pointer':'default'}} />
          ))}
          {walls.map(wl=>{
            const mx=(wl.a[0]+wl.b[0])/2, my=(wl.a[1]+wl.b[1])/2;
            return <text key={'l'+wl.index} x={mx} y={my-8} fontSize="11" fill="#7c8a99" textAnchor="middle" fontFamily="var(--mono)">{Math.round(wl.length)}cm</text>;
          })}
          {room.pillars && room.pillars.map(p=>(
            <g key={p.id} transform={`translate(${p.x},${p.y}) rotate(${p.rotation||0})`}>
              <rect x={-p.w/2} y={-p.d/2} width={p.w} height={p.d} fill="#7d8894" opacity="0.9"/>
            </g>
          ))}
          {room.obstructions && room.obstructions.map(o=>(
            <g key={o.id} transform={`translate(${o.x},${o.y}) rotate(${o.rotation||0})`}>
              <rect x={-o.w/2} y={-o.d/2} width={o.w} height={o.d} fill="#8a6a4a" opacity="0.85"/>
            </g>
          ))}
          {room.niches && room.niches.map(n=>(
            <rect key={n.id} x={n.x} y={n.y} width={n.w} height={n.d} fill="#0d1117" stroke="#3a4652" strokeDasharray="4 3" />
          ))}
        </g>
      </svg>
      {children}
    </div>
  );
}

/* small helper so every step can render a consistent bottom footer */
function WizardFooterPortal({children}){
  return <div className="wizard-footer" style={{position:'fixed', bottom:0, left:0, right:0}}>{children}</div>;
}

const INDIA_APARTMENT_HEIGHT_CM = 274.32; // standard ~9ft clear ceiling height

/* snap a raw point's direction (from `last`) to the nearest angle increment, keeping the raw distance */
function snapPoint(last, raw, snapDeg){
  if (!snapDeg) return raw;
  const dx = raw.x-last.x, dy = raw.y-last.y;
  const dist = Math.hypot(dx,dy);
  if (dist < 1) return raw;
  let ang = Math.atan2(dy,dx) * 180/Math.PI;
  ang = Math.round(ang/snapDeg) * snapDeg;
  const rad = ang*Math.PI/180;
  return { x: last.x + Math.cos(rad)*dist, y: last.y + Math.sin(rad)*dist };
}

/* rebuild an exact polygon (in cm) from sketch directions + real measured lengths.
   `points` = raw sketch coords (n points). `lengthsCm` = real length for edges 0..n-2.
   The final edge (back to the start point) is left to auto-close the loop. */
function rebuildFromMeasurements(points, lengthsCm){
  const n = points.length;
  const dirs = [];
  for (let i=0;i<n-1;i++){
    const a=points[i], b=points[i+1];
    const dx=b.x-a.x, dy=b.y-a.y;
    const len=Math.hypot(dx,dy)||1;
    dirs.push({x:dx/len, y:dy/len});
  }
  const out = [[0,0]];
  for (let i=0;i<n-1;i++){
    const prev = out[i];
    out.push([prev[0]+dirs[i].x*lengthsCm[i], prev[1]+dirs[i].y*lengthsCm[i]]);
  }
  return out;
}

/* --- Step 1: sketch the room shape, then attach real measurements --- */
function StepSketch({room, setRoom, onNext, hasShape, setHasShape, registerLocalUndo}){
  const [subPhase, setSubPhase] = useState(hasShape ? 'resume' : 'draw'); // resume | draw | measure | quick
  const [points, setPoints] = useState(room.sketchPoints || []);      // raw sketch coords
  const [snapDeg, setSnapDeg] = useState(45);     // 0 = free angles
  const [lengths, setLengths] = useState(room.sketchLengths || []);     // [{v,u}] per editable edge
  const [height, setHeight] = useState({v:'', u:'cm'});

  /* while actively placing corners, Ctrl+Z / the Undo button should remove
     the most recently placed point instead of reaching for the global history */
  useEffect(()=>{
    if (subPhase==='draw' && points.length>0){
      registerLocalUndo(()=>setPoints(p=>p.slice(0,-1)));
    } else {
      registerLocalUndo(null);
    }
    return () => registerLocalUndo(null);
  },[subPhase, points, registerLocalUndo]);

  const finishSketch = (pts) => {
    setPoints(pts);
    if (pts.length-1 !== lengths.length){
      setLengths(pts.slice(0,-1).map((p,i)=>{
        const q=pts[i+1];
        return { v: Math.round(Math.hypot(q.x-p.x,q.y-p.y)).toString(), u:'cm' };
      }));
    }
    setSubPhase('measure');
  };

  const mergeWithNext = (i) => {
    const newPoints = points.slice(0,i+1).concat(points.slice(i+2));
    const guess = { v: Math.round(Math.hypot(newPoints[i+1].x-newPoints[i].x, newPoints[i+1].y-newPoints[i].y)).toString(), u:'cm' };
    const newLengths = lengths.slice(0,i).concat([guess]).concat(lengths.slice(i+2));
    setPoints(newPoints);
    setLengths(newLengths);
  };

  const previewPolygonCm = useMemo(()=>{
    if (points.length<3) return null;
    const lens = lengths.map(l=>toCm(l.v,l.u)||1);
    return rebuildFromMeasurements(points, lens);
  },[points, lengths]);

  const apply = () => {
    const hc = height.v ? toCm(height.v, height.u) : INDIA_APARTMENT_HEIGHT_CM;
    setRoom(r=>({...r, polygon: previewPolygonCm, height: hc, heightIsDefault: !height.v, sketchPoints: points, sketchLengths: lengths}));
    setHasShape(true);
    onNext();
  };

  const [quick, setQuick] = useState({w:{v:'400',u:'cm'}, d:{v:'350',u:'cm'}, h:{v:'',u:'cm'}});
  const applyQuick = () => {
    const hc = quick.h.v ? toCm(quick.h.v, quick.h.u) : INDIA_APARTMENT_HEIGHT_CM;
    const wCm = toCm(quick.w.v,quick.w.u), dCm = toCm(quick.d.v,quick.d.u);
    const aspect = (wCm&&dCm) ? wCm/dCm : 1;
    const baseW = 300, baseD = baseW/aspect;
    const synthPoints = [{x:0,y:0},{x:baseW,y:0},{x:baseW,y:baseD},{x:0,y:baseD}];
    const synthLengths = [{v:quick.w.v,u:quick.w.u},{v:quick.d.v,u:quick.d.u},{v:quick.w.v,u:quick.w.u}];
    setRoom(r=>({...r, polygon: rectPolygon(wCm, dCm), height:hc, heightIsDefault: !quick.h.v, sketchPoints:synthPoints, sketchLengths:synthLengths}));
    setHasShape(true);
    onNext();
  };

  if (subPhase==='resume'){
    return (
      <div className="wizard-body">
        <div className="wizard-form">
          <div className="wizard-form-inner">
            <div className="step-heading">
              <h2>Step 1 — Your room shape</h2>
              <p>You already have a saved room shape. You can keep it as-is, adjust it further (your existing corners and measurements are still there to tweak), or start completely fresh.</p>
            </div>
            <button className="btn primary big" style={{width:'100%',justifyContent:'center',marginBottom:10}} onClick={onNext}>Keep this shape →</button>
            <button className="btn" style={{width:'100%',justifyContent:'center',marginBottom:10}} onClick={()=>setSubPhase('draw')}>Adjust this shape</button>
            <button className="btn ghost" style={{width:'100%',justifyContent:'center'}} onClick={()=>{setPoints([]); setLengths([]); setSubPhase('draw');}}>Start a completely new sketch</button>
          </div>
        </div>
        <ShapePreview room={room} />
      </div>
    );
  }

  if (subPhase==='quick'){
    return (
      <div className="wizard-body">
        <div className="wizard-form">
          <div className="wizard-form-inner">
            <div className="step-heading">
              <h2>Step 1 — Quick rectangle</h2>
              <p>Just a plain rectangular room? Enter its width, depth and ceiling height directly — any unit is fine.</p>
            </div>
            <UnitField label="Width" value={quick.w.v} unit={quick.w.u} onValue={v=>setQuick({...quick,w:{...quick.w,v}})} onUnit={u=>setQuick({...quick,w:{...quick.w,u}})} />
            <UnitField label="Depth" value={quick.d.v} unit={quick.d.u} onValue={v=>setQuick({...quick,d:{...quick.d,v}})} onUnit={u=>setQuick({...quick,d:{...quick.d,u}})} />
            <UnitField label="Ceiling height" value={quick.h.v} unit={quick.h.u} placeholder="Leave blank for 9 ft (Indian apartment standard)" onValue={v=>setQuick({...quick,h:{...quick.h,v}})} onUnit={u=>setQuick({...quick,h:{...quick.h,u}})} />
            <button className="btn ghost" onClick={()=>setSubPhase('draw')}>← Back to sketching</button>
          </div>
        </div>
        <ShapePreview room={{...room, polygon: rectPolygon(toCm(quick.w.v,quick.w.u)||1, toCm(quick.d.v,quick.d.u)||1)}} />
        <WizardFooterPortal>
          <div className="spacer"></div>
          <button className="btn primary big" onClick={applyQuick}>Next: Add fixed elements →</button>
        </WizardFooterPortal>
      </div>
    );
  }

  if (subPhase==='measure'){
    return (
      <div className="wizard-body">
        <div className="wizard-form">
          <div className="wizard-form-inner">
            <div className="step-heading">
              <h2>Step 1 — Enter measurements</h2>
              <p>Your sketch set the shape and corner angles. Now type in the real length of each wall — tape-measure numbers, any unit — and the drawing will straighten out to scale automatically. If two walls should really be one straight wall, merge them.</p>
            </div>
            <div className="section-label">Wall lengths</div>
            {lengths.map((l,i)=>(
              <div key={i}>
                <UnitField label={`Wall ${i+1}`} value={l.v} unit={l.u}
                  onValue={v=>setLengths(ls=>ls.map((x,idx)=>idx===i?{...x,v}:x))}
                  onUnit={u=>setLengths(ls=>ls.map((x,idx)=>idx===i?{...x,u}:x))} />
                {i<lengths.length-1 && (
                  <button className="btn small ghost" style={{marginBottom:12}} onClick={()=>mergeWithNext(i)}>Merge with wall {i+2} (remove corner between them)</button>
                )}
              </div>
            ))}
            <div className="hint-box">The last wall closes the loop automatically based on the others, so it isn't listed here — you'll see it complete the shape in the preview.</div>
            <div className="section-label">Ceiling height</div>
            <UnitField label="Height (optional)" value={height.v} unit={height.u}
              placeholder="Leave blank for 9 ft (Indian apartment standard)"
              onValue={v=>setHeight({...height,v})} onUnit={u=>setHeight({...height,u})} />
            <button className="btn ghost" onClick={()=>setSubPhase('draw')}>← Back to sketch (won't lose your walls)</button>
          </div>
        </div>
        <ShapePreview room={{...room, polygon: previewPolygonCm || rectPolygon(1,1)}} />
        <WizardFooterPortal>
          <div className="spacer"></div>
          <button className="btn primary big" onClick={apply}>Next: Add fixed elements →</button>
        </WizardFooterPortal>
      </div>
    );
  }

  /* subPhase === 'draw' */
  return (
    <div className="wizard-body">
      <div className="wizard-form">
        <div className="wizard-form-inner">
          <div className="step-heading">
            <h2>Step 1 — Sketch your room</h2>
            <p>Click to place each corner of your room, going around in order — don't worry about exact size, just get the <b>shape</b> right (L-shapes, alcoves, cut corners and all). Click an existing corner to merge/remove it, or click back on the starting point to close the shape.</p>
          </div>
          <div className="section-label">Angle snapping</div>
          <div className="toggle-2" style={{gridTemplateColumns:'1fr 1fr 1fr'}}>
            <button className={snapDeg===45?'active':''} onClick={()=>setSnapDeg(45)}>90° snap</button>
            <button className={snapDeg===15?'active':''} onClick={()=>setSnapDeg(15)}>15° snap</button>
            <button className={snapDeg===0?'active':''} onClick={()=>setSnapDeg(0)}>Free draw</button>
          </div>
          <div className="hint-box">{points.length===0 ? 'Click anywhere on the right to place your first corner.' : `${points.length} corner${points.length===1?'':'s'} placed. Click an existing corner to merge it away, or click near the first point to close the shape.`}</div>
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <button className="btn" style={{flex:1,justifyContent:'center'}} disabled={points.length===0} onClick={()=>setPoints(p=>p.slice(0,-1))}>Undo last point</button>
            <button className="btn" style={{flex:1,justifyContent:'center'}} disabled={points.length===0} onClick={()=>{setPoints([]); setLengths([]);}}>Clear all</button>
          </div>
          <button className="btn primary" style={{width:'100%',justifyContent:'center'}} disabled={points.length<3} onClick={()=>finishSketch(points)}>Finish sketch →</button>
          <div className="section-label">Prefer numbers only?</div>
          <button className="btn ghost" style={{width:'100%',justifyContent:'center'}} onClick={()=>setSubPhase('quick')}>Skip sketching — use a plain rectangle</button>
        </div>
      </div>
      <SketchCanvas points={points} setPoints={setPoints} snapDeg={snapDeg} onFinish={finishSketch} />
    </div>
  );
}

/* freeform click-to-draw canvas for the room outline */
function SketchCanvas({points, setPoints, snapDeg, onFinish}){
  const svgRef = useRef(null);
  const [hover, setHover] = useState(null);
  const CLOSE_RADIUS = 16;

  const toSvgPoint = (evt) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: loc.x, y: loc.y };
  };

  const tentative = useMemo(()=>{
    if (!hover || points.length===0) return hover;
    return snapPoint(points[points.length-1], hover, snapDeg);
  },[hover, points, snapDeg]);

  const nearStart = tentative && points.length>=3 &&
    Math.hypot(tentative.x-points[0].x, tentative.y-points[0].y) < CLOSE_RADIUS;

  /* hovering an existing interior corner (not the start point) offers merge/remove instead of a new point */
  const hoverMergeIndex = useMemo(()=>{
    if (!hover || points.length===0) return -1;
    for (let i=1;i<points.length;i++){
      if (Math.hypot(hover.x-points[i].x, hover.y-points[i].y) < CLOSE_RADIUS) return i;
    }
    return -1;
  },[hover, points]);

  const onMove = (e) => setHover(toSvgPoint(e.nativeEvent));
  const onClick = (e) => {
    const raw = toSvgPoint(e.nativeEvent);
    if (points.length===0){ setPoints([raw]); return; }
    for (let i=1;i<points.length;i++){
      if (Math.hypot(raw.x-points[i].x, raw.y-points[i].y) < CLOSE_RADIUS){
        setPoints(p=>p.filter((_,idx)=>idx!==i));
        return;
      }
    }
    const snapped = snapPoint(points[points.length-1], raw, snapDeg);
    if (points.length>=3 && Math.hypot(snapped.x-points[0].x, snapped.y-points[0].y) < CLOSE_RADIUS){
      onFinish(points);
      return;
    }
    setPoints(p=>[...p, snapped]);
  };

  return (
    <div className="wizard-preview">
      <svg ref={svgRef} width="100%" height="100%" viewBox="0 0 800 560"
        onMouseMove={onMove} onClick={onClick} style={{cursor:'crosshair'}}>
        {points.length>1 && (
          <polyline points={points.map(p=>`${p.x},${p.y}`).join(' ')} fill="none" stroke="#5fc9e8" strokeWidth="2.5" />
        )}
        {points.length>0 && tentative && hoverMergeIndex===-1 && (
          <line x1={points[points.length-1].x} y1={points[points.length-1].y} x2={tentative.x} y2={tentative.y}
            stroke={nearStart?'#6bcf9a':'#5fc9e8'} strokeWidth="2" strokeDasharray="6 4" />
        )}
        {points.map((p,i)=>(
          <circle key={i} cx={p.x} cy={p.y} r={i===0?7:(hoverMergeIndex===i?7:5)}
            fill={i===0?'#e8a94f':(hoverMergeIndex===i?'#e2685f':'#5fc9e8')} stroke="#0d1117" strokeWidth="1.5" />
        ))}
        {nearStart && <circle cx={points[0].x} cy={points[0].y} r={CLOSE_RADIUS} fill="none" stroke="#6bcf9a" strokeWidth="2" />}
      </svg>
      {points.length===0 && <div className="select-hint">Click to place your first corner, then keep clicking to trace the walls in order.</div>}
      {hoverMergeIndex>-1 && <div className="select-hint" style={{borderColor:'#e2685f'}}>Click to <b>merge this corner away</b>, joining its two walls into one</div>}
      {nearStart && hoverMergeIndex===-1 && <div className="select-hint" style={{borderColor:'#6bcf9a'}}>Click here to <b>close the shape</b></div>}
    </div>
  );
}

/* ============================== DESIGN STAGE (furniture + 2D/3D + vastu) ============================== */
const API_KEY_STORAGE = 'roomcraft_anthropic_key';

function DesignStage({room, furniture, setFurniture, northAngle, setNorthAngle, unit, customPresets, setCustomPresets}){
  const [view, setView] = useState('2d');
  const [selectedId, setSelectedId] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);
  const [chatLog, setChatLog] = useState([{role:'sys', text:'Vastu consultant ready. Ask about your current layout.'}]);
  const [chatBusy, setChatBusy] = useState(false);
  const [apiKey, setApiKey] = useState(()=>localStorage.getItem(API_KEY_STORAGE) || '');
  const [showKeyForm, setShowKeyForm] = useState(!localStorage.getItem(API_KEY_STORAGE));

  const saveApiKey = (key) => {
    const trimmed = key.trim();
    setApiKey(trimmed);
    if (trimmed) localStorage.setItem(API_KEY_STORAGE, trimmed);
    else localStorage.removeItem(API_KEY_STORAGE);
    setShowKeyForm(false);
  };

  const selected = furniture.find(f=>f.id===selectedId) || null;
  const overlappingIds = useMemo(()=>{
    const bad = new Set();
    furniture.forEach(item=>{ if (checkCollisions(item, room, furniture)) bad.add(item.id); });
    return bad;
  },[furniture, room]);

  const addFurniture = (preset, overrideDimsCm) => {
    const b = polygonBounds(room.polygon);
    const item = { id: uid(), type: preset.type, label: preset.label,
      family: preset.family, flags: preset.flags||{},
      w: (overrideDimsCm && overrideDimsCm.w) || preset.w,
      d: (overrideDimsCm && overrideDimsCm.d) || preset.d,
      h: (overrideDimsCm && overrideDimsCm.h) || preset.h,
      color: preset.color, x:(b.minX+b.maxX)/2, y:(b.minY+b.maxY)/2, rotation:0 };
    setFurniture(f=>[...f, item]);
    setSelectedId(item.id);
  };
  const updateFurniture = (id, patch) => setFurniture(f=>f.map(it=>it.id===id?{...it,...patch}:it));
  const removeFurniture = (id) => { setFurniture(f=>f.filter(it=>it.id!==id)); if(selectedId===id) setSelectedId(null); };

  const vastuPayload = useMemo(()=>({
    room: { walls: wallsFromPolygon(room.polygon).length, height_cm: room.height },
    north_offset_deg: northAngle,
    pillars: room.pillars.map(p=>({...p, zone:getZone(p.x,p.y,room,northAngle)})),
    obstructions: room.obstructions.map(o=>({...o, zone:getZone(o.x,o.y,room,northAngle)})),
    furniture: furniture.map(f=>({ type:f.type, label:f.label, w_cm:f.w, d_cm:f.d, h_cm:f.h,
      position_cm:{x:f.x,y:f.y}, rotation_deg:f.rotation, zone:getZone(f.x,f.y,room,northAngle) }))
  }),[room, furniture, northAngle]);

  const sendChat = async (text) => {
    if (!text.trim()) return;
    if (!apiKey){
      setChatLog(l=>[...l, {role:'user', text}, {role:'sys', text:'Add your Anthropic API key above to activate the consultant.'}]);
      setShowKeyForm(true);
      return;
    }
    const nextLog = [...chatLog, {role:'user', text}];
    setChatLog(nextLog); setChatBusy(true);
    try {
      const systemPrompt = `You are an expert Vastu Shastra consultant embedded in an interior design app.
You will receive a JSON snapshot of the user's real room layout (dimensions in cm, furniture positions, and each item's compass zone relative to the user's declared North).
Give concrete, specific feedback referencing the actual items and zones in the payload. State clearly whether the layout is compliant, name any violations by item and zone, and suggest specific alternative zones. Keep it under 180 words unless asked for more.

Current room layout JSON:
${JSON.stringify(vastuPayload, null, 2)}`;
      const messages = nextLog.filter(m=>m.role==='user'||m.role==='ai').map(m=>({role: m.role==='ai'?'assistant':'user', content:m.text}));
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model:"claude-sonnet-5", max_tokens:1000, system:systemPrompt, messages })
      });
      const data = await resp.json();
      if (!resp.ok){
        const msg = (data && data.error && data.error.message) || `Request failed (HTTP ${resp.status}).`;
        if (resp.status===401){
          setChatLog(l=>[...l, {role:'sys', text:`Your API key was rejected: ${msg}. Double-check it at console.anthropic.com/settings/keys.`}]);
          setShowKeyForm(true);
        } else if (resp.status===429){
          setChatLog(l=>[...l, {role:'sys', text:'Rate limited — please wait a moment and try again.'}]);
        } else {
          setChatLog(l=>[...l, {role:'sys', text:`Vastu consultant error: ${msg}`}]);
        }
        return;
      }
      const textOut = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim() || 'Sorry, I could not analyze the layout right now.';
      setChatLog(l=>[...l, {role:'ai', text:textOut}]);
    } catch(err){
      setChatLog(l=>[...l, {role:'sys', text:'Network error reaching the Vastu consultant. Check your connection and try again.'}]);
    } finally { setChatBusy(false); }
  };

  return (
    <div className="design-layout">
      <div className="panel" style={{width:280}}>
        <div className="panel-inner">
          <div className="section-label">Furniture library</div>
          <FurnitureLibraryPanel onAdd={addFurniture} customPresets={customPresets}
            onCreateCustom={(preset)=>setCustomPresets(cp=>[...cp, preset])} />
          <div className="section-label">Vastu compass</div>
          <div className="hint-box">Set which direction is North so the AI consultant can judge item placement correctly.</div>
        </div>
      </div>
      <div className="center-col">
        <div className="viewbar">
          <div className="tabs">
            <button className={view==='2d'?'active':''} onClick={()=>setView('2d')}>2D Floor Plan</button>
            <button className={view==='3d'?'active':''} onClick={()=>setView('3d')}>3D Perspective</button>
          </div>
          <div className="spacer"></div>
          <span style={{fontSize:11.5,color:'var(--muted)'}}>Drag items to reposition · red = collision</span>
        </div>
        <div className="canvas-wrap">
          {view==='2d' ? (
            <Canvas2D room={room} furniture={furniture} selectedId={selectedId} setSelectedId={setSelectedId}
              updateFurniture={updateFurniture} overlappingIds={overlappingIds} unit={unit} />
          ) : (
            <Canvas3D room={room} furniture={furniture} selectedId={selectedId} setSelectedId={setSelectedId}
              updateFurniture={updateFurniture} overlappingIds={overlappingIds} />
          )}
          <Legend />
          <CompassBadge northAngle={northAngle} setNorthAngle={setNorthAngle} />
        </div>
      </div>
      <div className="panel right" style={{width:300}}>
        <div className="panel-inner">
          <div className="section-label">Selected item</div>
          {!selected ? (
            <div className="empty-hint">Click an item on the canvas, or add one from the library, to edit its size, color and rotation.</div>
          ) : (
            <div>
              {overlappingIds.has(selected.id) && <div className="warn-banner">⚠ Overlaps a wall, pillar or another item</div>}
              <div className="uf"><span className="lbl">Label</span>
                <input type="text" value={selected.label} onChange={e=>updateFurniture(selected.id,{label:e.target.value})} /></div>
              <DimensionFields key={selected.id} selected={selected} unit={unit} updateFurniture={updateFurniture} />
              <div className="uf"><span className="lbl">Rotation</span>
                <div className="slider-row">
                  <input type="range" min="0" max="359" value={selected.rotation||0} onChange={e=>updateFurniture(selected.id,{rotation:parseInt(e.target.value)})} />
                  <span className="badge">{selected.rotation||0}°</span>
                </div>
              </div>
              <div className="uf"><span className="lbl">Color</span>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <input type="color" value={selected.color} onChange={e=>updateFurniture(selected.id,{color:e.target.value})} />
                  <span style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--muted)'}}>{selected.color}</span>
                </div>
              </div>
              <div style={{marginBottom:10}}><span className="badge">Vastu zone: {getZone(selected.x,selected.y,room,northAngle)}</span></div>
              <button className="btn danger" style={{width:'100%',justifyContent:'center'}} onClick={()=>removeFurniture(selected.id)}>Remove item</button>
            </div>
          )}
        </div>
      </div>
      <ChatDrawer open={chatOpen} setOpen={setChatOpen} log={chatLog} busy={chatBusy} onSend={sendChat}
        apiKey={apiKey} showKeyForm={showKeyForm} setShowKeyForm={setShowKeyForm} onSaveKey={saveApiKey} />
    </div>
  );
}

}

/* categorized + searchable furniture library */
function FurnitureLibraryPanel({onAdd, customPresets, onCreateCustom}){
  const [query, setQuery] = useState('');
  const [openCats, setOpenCats] = useState(()=>new Set([FURNITURE_LIBRARY[0].category]));
  const [showCustomForm, setShowCustomForm] = useState(false);
  const toggleCat = (cat) => setOpenCats(s=>{ const n=new Set(s); n.has(cat)?n.delete(cat):n.add(cat); return n; });

  const handleAdd = (item, dims, dimUnit) => {
    if (dims && dims.length){
      const overrideDimsCm = {};
      if (dims[0]!=null) overrideDimsCm.w = toCm(dims[0], dimUnit);
      if (dims[1]!=null) overrideDimsCm.d = toCm(dims[1], dimUnit);
      if (dims[2]!=null) overrideDimsCm.h = toCm(dims[2], dimUnit);
      onAdd(item, overrideDimsCm);
    } else {
      onAdd(item);
    }
  };

  const customSection = (
    <div style={{marginBottom:14}}>
      <div className="section-label">My furniture</div>
      {customPresets.length>0 && (
        <div className="furniture-list" style={{marginBottom:8}}>
          {customPresets.map(it=>(
            <div key={it.type} className="furn-row" onClick={()=>onAdd(it)} title={`${Math.round(it.w)}×${Math.round(it.d)}×${Math.round(it.h)} cm`}>{it.label}</div>
          ))}
        </div>
      )}
      {!showCustomForm ? (
        <button className="btn ghost" style={{width:'100%',justifyContent:'center'}} onClick={()=>setShowCustomForm(true)}>+ Create custom furniture</button>
      ) : (
        <CustomFurnitureForm onCancel={()=>setShowCustomForm(false)} onCreate={(preset)=>{ onCreateCustom(preset); onAdd(preset); setShowCustomForm(false); }} />
      )}
    </div>
  );

  if (query.trim()){
    const parsed = parseSearchQuery(query);
    const needle = parsed.nameText.toLowerCase();
    const results = ALL_FURNITURE_ITEMS.filter(it => !needle || it.label.toLowerCase().includes(needle));
    return (
      <div>
        <input type="text" value={query} onChange={e=>setQuery(e.target.value)}
          placeholder="Search furniture… e.g. dining table 180x90x75cm" style={{marginBottom:10}} />
        {parsed.dims && (
          <div className="hint-box">Detected size: <b>{parsed.dims.join(' × ')} {parsed.unit}</b> — will be applied to whichever piece you add.</div>
        )}
        {results.length===0 ? (
          <div className="empty-hint">No matches. Try a different name.</div>
        ) : (
          <div className="furniture-list" style={{marginBottom:14}}>
            {results.map(it=>(
              <div key={it.type} className="furn-row" onClick={()=>handleAdd(it, parsed.dims, parsed.unit)}>
                {it.label}<span style={{color:'var(--muted)',fontSize:11}}> · {it.category}</span>
              </div>
            ))}
          </div>
        )}
        {customSection}
      </div>
    );
  }

  return (
    <div>
      <input type="text" value={query} onChange={e=>setQuery(e.target.value)}
        placeholder="Search furniture… e.g. dining table 180x90x75cm" style={{marginBottom:12}} />
      {FURNITURE_LIBRARY.map(cat=>{
        const open = openCats.has(cat.category);
        return (
          <div key={cat.category} style={{marginBottom:6}}>
            <div onClick={()=>toggleCat(cat.category)}
              style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',padding:'8px 10px',background:'var(--panel-2)',border:'1px solid var(--line)',borderRadius:6,fontSize:12.5,fontWeight:600,color:'#fff'}}>
              {cat.category}
              <span style={{color:'var(--muted)'}}>{open?'▾':'▸'}</span>
            </div>
            {open && (
              <div style={{padding:'8px 2px 2px'}}>
                {cat.groups.map(g=>(
                  <div key={g.name} style={{marginBottom:10}}>
                    <div style={{fontSize:10.5,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>{g.name}</div>
                    <div className="furniture-list">
                      {g.items.map(it=>(
                        <div key={it.type} className="furn-row" onClick={()=>onAdd(it)} title={`${it.w}×${it.d}×${it.h} cm`}>{it.label}</div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

        );
      })}

  );
}

function Canvas2D({room, furniture, selectedId, setSelectedId, updateFurniture, overlappingIds, unit}){
  const PAD = 50;
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const b = polygonBounds(room.polygon);
  const vbW = (b.maxX-b.minX) + PAD*2, vbH = (b.maxY-b.minY) + PAD*2;

  const toSvgPoint = (evt) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: loc.x, y: loc.y };
  };
  const onPointerDownItem = (e, item) => {
    e.stopPropagation(); setSelectedId(item.id);
    const p = toSvgPoint(e.nativeEvent);
    dragRef.current = { id:item.id, mode:'move', dx: p.x-item.x, dy: p.y-item.y };
  };
  const onPointerDownRotate = (e, item) => { e.stopPropagation(); dragRef.current = { id:item.id, mode:'rotate' }; };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const p = toSvgPoint(e.nativeEvent);
    const item = furniture.find(f=>f.id===dragRef.current.id);
    if (!item) return;
    if (dragRef.current.mode==='move'){
      updateFurniture(item.id, { x: p.x-dragRef.current.dx, y: p.y-dragRef.current.dy });
    } else {
      const ang = Math.atan2(p.y-item.y, p.x-item.x)*180/Math.PI + 90;
      updateFurniture(item.id, { rotation: Math.round(((ang%360)+360)%360) });
    }
  };
  const onPointerUp = () => { dragRef.current = null; };

  return (
    <svg ref={svgRef} width="100%" height="100%" viewBox={`${b.minX-PAD} ${b.minY-PAD} ${vbW} ${vbH}`}
      onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
      onPointerDown={()=>setSelectedId(null)}>
      <polygon points={room.polygon.map(p=>p.join(',')).join(' ')} fill="#10151c" stroke="#3a4652" strokeWidth="3" />

      {room.niches.map(n=>(
        <rect key={n.id} x={n.x} y={n.y} width={n.w} height={n.d} fill="#0d1117" stroke="#3a4652" strokeDasharray="4 3" />
      ))}
      {room.pillars.map(p=>(
        <g key={p.id} transform={`translate(${p.x},${p.y}) rotate(${p.rotation||0})`}>
          <rect x={-p.w/2} y={-p.d/2} width={p.w} height={p.d} fill={p.color} stroke="#0d1117" strokeWidth="1" opacity="0.9"/>
        </g>
      ))}
      {room.obstructions.map(o=>(
        <g key={o.id} transform={`translate(${o.x},${o.y}) rotate(${o.rotation||0})`}>
          <rect x={-o.w/2} y={-o.d/2} width={o.w} height={o.d} fill={o.color} stroke="#0d1117" strokeWidth="1" opacity="0.85"/>
          <text y={o.d/2+11} textAnchor="middle" fontSize="9" fill="#9aa5b1">{o.label}</text>
        </g>
      ))}
      {furniture.map(item=>{
        const isSel = item.id===selectedId, bad = overlappingIds.has(item.id);
        return (
          <g key={item.id} transform={`translate(${item.x},${item.y}) rotate(${item.rotation||0})`}
            onPointerDown={(e)=>onPointerDownItem(e,item)} style={{cursor:'grab'}}>
            <rect x={-item.w/2} y={-item.d/2} width={item.w} height={item.d}
              fill={item.color} opacity={bad?0.55:0.92}
              stroke={bad?'#e2685f':(isSel?'#5fc9e8':'#0d1117')} strokeWidth={isSel||bad?2.5:1} />
            <text y={4} textAnchor="middle" fontSize="10" fill="#fff" style={{pointerEvents:'none'}}>{item.label}</text>
            {isSel && (
              <g onPointerDown={(e)=>onPointerDownRotate(e,item)} style={{cursor:'ew-resize'}}>
                <line x1="0" y1={-item.d/2} x2="0" y2={-item.d/2-22} stroke="#5fc9e8" strokeWidth="1.5"/>
                <circle cx="0" cy={-item.d/2-26} r="6" fill="#5fc9e8"/>
              </g>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ============================== 3D FURNITURE MOCKUPS ============================== */
function mat(color, opacity){
  const m = new THREE.MeshStandardMaterial({ color: color||'#888888', side: THREE.DoubleSide });
  if (opacity!=null){ m.transparent = true; m.opacity = opacity; }
  return m;
}
function shade(hex, percent){
  try{
    const c = new THREE.Color(hex);
    if (percent>=0) c.lerp(new THREE.Color('#ffffff'), percent/100);
    else c.lerp(new THREE.Color('#000000'), -percent/100);
    return '#'+c.getHexString();
  }catch(e){ return hex; }
}

function tableGroup(w,d,h,color,flags){
  flags = flags||{};
  const g = new THREE.Group();
  const topT = Math.max(0.02, Math.min(0.05, h*0.08));
  const top = new THREE.Mesh(new THREE.BoxGeometry(w, topT, d), mat(color));
  top.position.y = h - topT/2; g.add(top);
  const legW = Math.max(0.02, Math.min(w,d)*0.06);
  const legH = h - topT;
  const legMat = mat(shade(color,-18));
  const ox = w/2-legW*1.4, oz = d/2-legW*1.4;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
    const leg = new THREE.Mesh(new THREE.BoxGeometry(legW, legH, legW), legMat);
    leg.position.set(sx*ox, legH/2, sz*oz); g.add(leg);
  });
  if (flags.withBenches){
    [-1,1].forEach(side=>{
      const bench = new THREE.Mesh(new THREE.BoxGeometry(w*0.85, topT, d*0.28), legMat);
      bench.position.set(0, h*0.45, side*(d/2+d*0.28)); g.add(bench);
    });
  }
  if (flags.nested){
    const sub = tableGroup(w*0.65, d*0.65, h*0.7, shade(color,10), {});
    sub.position.set(w*0.35, 0, 0); g.add(sub);
  }
  return g;
}
function chairGroup(w,d,h,color,flags){
  flags = flags||{};
  const g = new THREE.Group();
  const seatH = h*0.45;
  const seatT = Math.max(0.02, h*0.05);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(w, seatT, d), mat(color));
  seat.position.y = seatH; g.add(seat);
  const legMat = mat(shade(color,-22));
  const legW = Math.max(0.015, Math.min(w,d)*0.08);
  if (flags.wheelBase){
    const base = new THREE.Mesh(new THREE.CylinderGeometry(w*0.32, w*0.32, seatH*0.05, 14), legMat);
    base.position.y = seatH*0.03; g.add(base);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(legW*0.6, legW*0.6, seatH*0.9, 10), legMat);
    pole.position.y = seatH*0.5; g.add(pole);
  } else {
    const ox=w/2-legW, oz=d/2-legW;
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
      const leg = new THREE.Mesh(new THREE.BoxGeometry(legW, seatH, legW), legMat);
      leg.position.set(sx*ox, seatH/2, sz*oz); g.add(leg);
    });
  }
  if (flags.hasBack !== false){
    const backH = Math.max(0.05, h-seatH);
    const back = new THREE.Mesh(new THREE.BoxGeometry(w, backH, seatT), mat(color));
    back.position.set(0, seatH+backH/2, -d/2+seatT/2); g.add(back);
  }
  if (flags.hasArms){
    const armH = h*0.22;
    [-1,1].forEach(sx=>{
      const arm = new THREE.Mesh(new THREE.BoxGeometry(seatT*1.4, armH, d*0.8), mat(shade(color,12)));
      arm.position.set(sx*(w/2-seatT*0.7), seatH+armH/2, 0); g.add(arm);
    });
  }
  if (flags.hasFootrest){
    const foot = new THREE.Mesh(new THREE.BoxGeometry(w*0.85, seatT, d*0.45), mat(color));
    foot.position.set(0, seatH*0.55, d/2+d*0.28); g.add(foot);
  }
  if (flags.rockers){
    [-1,1].forEach(sz=>{
      const rocker = new THREE.Mesh(new THREE.TorusGeometry(Math.max(w,d)*0.5, legW*0.6, 6, 14, Math.PI*0.85), mat(shade(color,-30)));
      rocker.rotation.y = Math.PI/2;
      rocker.position.set(0, legW*0.6, sz*d*0.28); g.add(rocker);
    });

function buildFurnitureMockup(item, S){
  const w = Math.max(0.05, item.w/S), d = Math.max(0.05, item.d/S), h = Math.max(0.05, item.h/S);
  const flags = item.flags || {};

  let body;
  switch(item.family){
    case 'table': body = tableGroup(w,d,h,item.color,flags); break;
    case 'chair': body = chairGroup(w,d,h,item.color,flags); break;
    case 'sofa': body = sofaGroup(w,d,h,item.color,flags); break;
    case 'bench': body = benchGroup(w,d,h,item.color,flags); break;
    case 'bed': body = bedGroup(w,d,h,item.color,flags); break;
    case 'mattress': body = mattressGroup(w,d,h,item.color); break;
    case 'cabinet': body = cabinetGroup(w,d,h,item.color,flags); break;
    case 'mirror': body = mirrorGroup(w,d,h,item.color,flags); break;
    case 'roundseat': body = roundSeatGroup(w,d,h,item.color); break;
    case 'hammock': body = hammockGroup(w,d,h,item.color); break;
    default: {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(item.color));
      mesh.position.y = h/2; body = new THREE.Group(); body.add(mesh);
    }
  }
  g.add(body);
  // translucent highlight shell used for selection / collision feedback
  const highlight = new THREE.Mesh(new THREE.BoxGeometry(w*1.04,h*1.04,d*1.04), new THREE.MeshBasicMaterial({color:'#5fc9e8', transparent:true, opacity:0, depthWrite:false}));
  highlight.position.y = h/2; highlight.userData.isHighlight = true;
  g.add(highlight);
  return g;
}
function disposeGroup(group){
  group.traverse(obj=>{
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material){ (Array.isArray(obj.material)?obj.material:[obj.material]).forEach(m=>m.dispose()); }
  });
}

function Canvas3D({room, furniture, selectedId, setSelectedId, updateFurniture, overlappingIds}){
  const mountRef = useRef(null);
  const sceneRef = useRef({});
  const S = 100;

  useEffect(()=>{
    const mount = mountRef.current;
    const width = mount.clientWidth, height = mount.clientHeight;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(50, width/height, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    mount.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(5,8,4); scene.add(dl);
    scene.add(new THREE.GridHelper(20, 40, 0x2c5568, 0x1c2530));

    let radius=8, theta=Math.PI/4, phi=Math.PI/3.2;
    let target = new THREE.Vector3(0,0,0);
    const updateCam = () => {
      camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta), target.y+radius*Math.cos(phi), target.z+radius*Math.sin(phi)*Math.cos(theta));
      camera.lookAt(target);
    };
    updateCam();

    let isOrbiting=false,lastX=0,lastY=0, isDraggingItem=false, dragId=null, dragOffset=new THREE.Vector3();
    const raycaster = new THREE.Raycaster();
    const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
    const pointer = new THREE.Vector2();
    const meshMap = new Map();
    const roomGroup = new THREE.Group(); scene.add(roomGroup);
    const furnGroup = new THREE.Group(); scene.add(furnGroup);

    function getPointerNDC(evt){
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((evt.clientX-rect.left)/rect.width)*2-1;
      pointer.y = -((evt.clientY-rect.top)/rect.height)*2+1;
    }
    function onPointerDown(evt){
      getPointerNDC(evt); raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(furnGroup.children, true);
      let target = null;
      if (hits.length>0){
        let obj = hits[0].object;
        while (obj && obj.userData.id==null && obj.parent) obj = obj.parent;
        if (obj && obj.userData.id!=null) target = obj;
      }
      if (target){
        dragId = target.userData.id; isDraggingItem = true;
        sceneRef.current.onSelect(dragId);
        const hit = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
        if (hit) dragOffset.copy(hit).sub(target.position);
      } else { isOrbiting = true; lastX=evt.clientX; lastY=evt.clientY; sceneRef.current.onSelect(null); }
    }
    function onPointerMove(evt){
      if (isDraggingItem){
        getPointerNDC(evt); raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.ray.intersectPlane(floorPlane, new THREE.Vector3());
        if (hit){
          const b = sceneRef.current.bounds;
          const nx = (hit.x - dragOffset.x) + b.minX/S;
          const nz = (hit.z - dragOffset.z) + b.minY/S;
          sceneRef.current.onDrag(dragId, nx*S, nz*S);
        }
      } else if (isOrbiting){
        const dx = evt.clientX-lastX, dy = evt.clientY-lastY;
        theta -= dx*0.01; phi = Math.max(0.15, Math.min(Math.PI/2-0.05, phi-dy*0.01));
        lastX=evt.clientX; lastY=evt.clientY; updateCam();
      }
    }
    function onPointerUp(){ isOrbiting=false; isDraggingItem=false; dragId=null; }
    function onWheel(evt){ evt.preventDefault(); radius=Math.max(2,Math.min(30,radius+evt.deltaY*0.005)); updateCam(); }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('wheel', onWheel, {passive:false});
    let raf; function animate(){ raf=requestAnimationFrame(animate); renderer.render(scene,camera);} animate();

    sceneRef.current = { scene, camera, renderer, roomGroup, furnGroup, meshMap, bounds:{minX:0,minY:0},
      onSelect:()=>{}, onDrag:()=>{},
      updateCamTarget:(b)=>{ const w=(b.maxX-b.minX)/S, d=(b.maxY-b.minY)/S; target.set(w/2,0,d/2); radius=Math.max(w,d)*1.4+2; updateCam(); } };

    const onResize=()=>{ const w=mount.clientWidth,h=mount.clientHeight; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(raf); window.removeEventListener('resize', onResize);
      window.removeEventListener('pointermove', onPointerMove); window.removeEventListener('pointerup', onPointerUp);
      renderer.domElement.removeEventListener('wheel', onWheel); mount.removeChild(renderer.domElement);
    };
  },[]);

  useEffect(()=>{ sceneRef.current.onSelect=setSelectedId; sceneRef.current.onDrag=(id,x,y)=>updateFurniture(id,{x,y}); },[setSelectedId, updateFurniture]);

  useEffect(()=>{
    const ctx = sceneRef.current;
    if (!ctx.roomGroup) return;
    const b = polygonBounds(room.polygon);
    ctx.bounds = b;
    ctx.roomGroup.clear();
    const shapePts = room.polygon.map(p=>new THREE.Vector2((p[0]-b.minX)/S, (p[1]-b.minY)/S));
    const shape = new THREE.Shape(shapePts);
    const floorGeo = new THREE.ShapeGeometry(shape);
    const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({color:0x1a222c, side:THREE.DoubleSide}));
    floor.rotation.x = Math.PI/2;
    ctx.roomGroup.add(floor);

    const h = room.height/S;
    const wallMat = new THREE.MeshStandardMaterial({color:0x2a3440, transparent:true, opacity:0.35, side:THREE.DoubleSide});
    const walls = wallsFromPolygon(room.polygon);
    walls.forEach(wl=>{
      const ax=(wl.a[0]-b.minX)/S, ay=(wl.a[1]-b.minY)/S, bx=(wl.b[0]-b.minX)/S, by=(wl.b[1]-b.minY)/S;
      const len = Math.hypot(bx-ax, by-ay);
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, h), wallMat);
      wall.position.set((ax+bx)/2, h/2, (ay+by)/2);
      wall.rotation.y = -Math.atan2(by-ay, bx-ax);
      ctx.roomGroup.add(wall);
    });
    const addBox = (el, color) => {
      const geo = new THREE.BoxGeometry(el.w/S, el.h/S, el.d/S);
      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color}));
      mesh.position.set((el.x-b.minX)/S, el.h/S/2, (el.y-b.minY)/S);
      mesh.rotation.y = -((el.rotation||0)*Math.PI/180);
      ctx.roomGroup.add(mesh);
    };
    room.pillars.forEach(p=>addBox(p,0x7d8894));
    room.obstructions.forEach(o=>addBox(o,0x8a6a4a));
    ctx.updateCamTarget(b);
  },[room]);

  useEffect(()=>{
    const ctx = sceneRef.current;
    if (!ctx.furnGroup) return;
    const b = ctx.bounds;
    const seen = new Set();
    furniture.forEach(item=>{
      seen.add(item.id);
      let entry = ctx.meshMap.get(item.id);
      const sig = [item.family, item.w, item.d, item.h, item.color, JSON.stringify(item.flags||{})].join('|');
      if (!entry || entry.sig !== sig){
        if (entry){ ctx.furnGroup.remove(entry.group); disposeGroup(entry.group); }
        const group = buildFurnitureMockup(item, S);
        group.userData.id = item.id;
        ctx.furnGroup.add(group);
        entry = { group, sig };
        ctx.meshMap.set(item.id, entry);
      }
      const group = entry.group;
      group.position.set((item.x-b.minX)/S, 0, (item.y-b.minY)/S);
      group.rotation.y = -((item.rotation||0)*Math.PI/180);
      const bad = overlappingIds.has(item.id), isSel = item.id===selectedId;
      const highlight = group.children.find(c=>c.userData.isHighlight);
      if (highlight){
        if (bad){ highlight.material.color.set('#e2685f'); highlight.material.opacity = 0.35; }
        else if (isSel){ highlight.material.color.set('#5fc9e8'); highlight.material.opacity = 0.22; }
        else { highlight.material.opacity = 0; }
      }
    });
    for (const [id,entry] of ctx.meshMap.entries()){
      if (!seen.has(id)){ ctx.furnGroup.remove(entry.group); disposeGroup(entry.group); ctx.meshMap.delete(id); }
    }
  },[furniture, selectedId, overlappingIds]);

  return <div ref={mountRef} style={{width:'100%',height:'100%'}}></div>;
}

function CompassBadge({northAngle, setNorthAngle}){
  const ref = useRef(null); const dragging = useRef(false);
  const onDown = () => { dragging.current = true; };
  const onMove = (e) => {
    if (!dragging.current || !ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const ang = Math.atan2(e.clientX-cx, -(e.clientY-cy))*180/Math.PI;
    setNorthAngle(Math.round(((ang%360)+360)%360));
  };
  const onUp = () => { dragging.current = false; };
  useEffect(()=>{
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp);
    return ()=>{ window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  },[]);
  return (
    <div className="compass-badge" ref={ref}>
      <svg viewBox="0 0 100 100" width="100%" height="100%" onPointerDown={onDown} style={{cursor:'grab'}}>
        <circle cx="50" cy="50" r="46" fill="rgba(20,26,34,0.85)" stroke="#232d38" strokeWidth="2"/>
        <g transform={`rotate(${northAngle} 50 50)`}>
          <polygon points="50,10 44,50 56,50" fill="#e2685f"/>
          <polygon points="50,90 44,50 56,50" fill="#5fc9e8"/>
          <text x="50" y="22" fontSize="10" fill="#fff" textAnchor="middle">N</text>
        </g>
        <circle cx="50" cy="50" r="3" fill="#dfe6ee"/>
      </svg>
      <div style={{textAlign:'center',fontSize:9,color:'var(--muted)'}}>drag = set North</div>
    </div>
  );
}

      {showKeyForm && (
        <div style={{padding:'12px 14px', borderBottom:'1px solid var(--line)', background:'var(--panel-2)'}}>
          <div style={{fontSize:11.5, color:'var(--muted)', lineHeight:1.6, marginBottom:8}}>
            This runs Claude directly from your browser using your own Anthropic API key — it's stored only in this browser's local storage, never sent anywhere except api.anthropic.com.
            Get a key at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" style={{color:'var(--blue)'}}>console.anthropic.com/settings/keys</a>.
          </div>
          <div style={{display:'flex',gap:6}}>
            <input type="password" placeholder="sk-ant-…" defaultValue={apiKey} onChange={e=>setKeyInput(e.target.value)}
              style={{flex:1}} onKeyDown={e=>{ if(e.key==='Enter') onSaveKey(keyInput || apiKey); }} />
            <button className="btn primary small" onClick={()=>onSaveKey(keyInput || apiKey)}>Save</button>
          </div>
          {apiKey && <button className="btn danger small" style={{marginTop:8}} onClick={()=>{ onSaveKey(''); setKeyInput(''); }}>Remove saved key</button>}
        </div>
      )}
      <div className="chat-body" ref={bodyRef}>
        {log.map((m,i)=>(<div key={i} className={"bubble "+m.role}>{m.text}</div>))}
        {busy && <div className="bubble ai">Analyzing layout…</div>}
      </div>
      <div className="chat-input">
        <input type="text" placeholder="Ask about your layout…" value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') submit(); }} />
        <button className="btn primary" onClick={submit} disabled={busy}>Send</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
